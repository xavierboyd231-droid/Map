<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chocolates Tutoring - Study Portal</title>
    <link id="page-favicon" rel="icon" href="https://ssl.gstatic.com/classroom/ic_product_classic_144.png">
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --card-bg: #252525;
            --accent-color: #00ffcc;
            --accent-hover: #00b38f;
            --text-color: #ffffff;
            --text-secondary: #a0a0a0;
            --border-color: #333333;
        }

        [data-theme="milk"] {
            --bg-color: #2c221e;
            --panel-bg: #3b2e29;
            --card-bg: #4a3b34;
            --accent-color: #f4a261;
            --accent-hover: #e76f51;
            --text-color: #fdf0d5;
            --text-secondary: #d8b4a0;
            --border-color: #5c473f;
        }

        [data-theme="white"] {
            --bg-color: #f0f2f5;
            --panel-bg: #ffffff;
            --card-bg: #ffffff;
            --accent-color: #4f46e5;
            --accent-hover: #4338ca;
            --text-color: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 2px solid var(--border-color);
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-area h1 {
            font-size: 1.3rem;
            color: var(--accent-color);
        }

        .search-bar {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 15px;
            border-radius: 20px;
            color: var(--text-color);
            width: 320px;
            outline: none;
        }

        .search-bar:focus {
            border-color: var(--accent-color);
        }

        .nav-controls {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .nav-btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        sidebar {
            width: 250px;
            background-color: var(--panel-bg);
            border-right: 2px solid var(--border-color);
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
        }

        .category-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .cat-btn {
            background: transparent;
            color: var(--text-color);
            border: none;
            padding: 10px 12px;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cat-btn:hover, .cat-btn.active {
            background-color: var(--card-bg);
            color: var(--accent-color);
            font-weight: bold;
        }

        .content-area {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 20px;
        }

        .game-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            border-color: var(--accent-color);
        }

        .game-thumbnail {
            height: 130px;
            background-color: var(--card-bg);
            position: relative;
            overflow: hidden;
        }

        .game-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .game-card:hover .game-thumbnail img {
            transform: scale(1.08);
        }

        .game-info {
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .game-title {
            font-size: 1.05rem;
            font-weight: bold;
        }

        .game-cat {
            font-size: 0.75rem;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        #gamePlayerView {
            display: none;
            flex-direction: column;
            flex: 1;
            background-color: var(--panel-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .player-toolbar {
            background-color: var(--card-bg);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .player-title {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--accent-color);
        }

        iframe {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            display: none;
        }

            border: 1px solid var(--border-color);
            padding:
